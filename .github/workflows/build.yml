name: Supported desktop builds
on:
  push:
    branches: [main, "codex/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            artifact: win-amd64
          - runner: macos-15
            target: aarch64-apple-darwin
            artifact: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: python3 scripts/validate-release.py "${{ github.ref_name }}"
      - name: Confirm native runner architecture
        shell: bash
        run: |
          rustc -vV
          if [[ "${{ runner.os }}" == macOS ]]; then
            test "$(uname -m)" = arm64
            [[ "$(rustc -vV)" == *'host: aarch64-apple-darwin'* ]]
          else
            [[ "$(rustc -vV)" == *'host: x86_64-pc-windows-msvc'* ]]
          fi
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --target ${{ matrix.target }}
      - run: cargo clippy --locked --workspace --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --locked --workspace --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Third party notices
        shell: bash
        run: python3 scripts/notices.py --target ${{ matrix.target }}
      - name: macOS unsigned bundle
        if: runner.os == 'macOS'
        run: bash packaging/macos/bundle.sh release
      - name: Windows portable package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleSnip-${{ matrix.artifact }}-unsigned
          path: |
            dist/*.zip
            dist/*.dmg
            dist/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: SimpleSnip-*-unsigned
          path: release-assets
          merge-multiple: true
      - name: Create checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cd release-assets
          shasum -a 256 *.zip *.dmg > SHA256SUMS
          notes="../docs/releases/${RELEASE_TAG#v}.md"
          if [[ -f "$notes" ]]; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Simple Snip ${RELEASE_TAG#v}" --notes-file "$notes" *.zip *.dmg SHA256SUMS
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Simple Snip ${RELEASE_TAG#v}" --generate-notes *.zip *.dmg SHA256SUMS
          fi
