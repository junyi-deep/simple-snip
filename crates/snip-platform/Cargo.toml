[package]
name = "snip-platform"
version = "0.0.7"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow.workspace = true
image.workspace = true
tracing.workspace = true
snip-core = { path = "../snip-core" }
xcap = "=0.9.8"
arboard = "3"
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
dispatch2 = "=0.3.1"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2-vision = "0.3.2"
objc2-screen-capture-kit = "=0.3.2"
block2 = "0.6"
objc2-core-graphics = "0.3.2"
objc2-core-foundation = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Com", "Win32_System_Threading", "Win32_System_LibraryLoader", "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Globalization"] }
